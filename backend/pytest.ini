[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = src
testpaths = tests
# Tự động xuất report vào docs/automation của dự án lớn
addopts = --cov=src --cov-report=term-missing --cov-report=html:../docs/automation/coverage_html --cov-fail-under=80

# Chặn đứng các cảnh báo gây nhiễu từ Django 6.0 và thư viện bên thứ 3
filterwarnings =
    ignore::django.utils.deprecation.RemovedInDjango50Warning
    ignore::django.utils.deprecation.RemovedInDjango51Warning
    ignore::DeprecationWarning:drf_yasg.*
    ignore::DeprecationWarning:oauth2_provider.*